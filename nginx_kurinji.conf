server {
    listen 80;
    server_name _;

    # Maximum upload size for raw WAV audio recording files
    client_max_body_size 25M;

    # Production React 19 Frontend static files
    root /var/www/kurinji/frontend/dist;
    index index.html;

    # Gzip Compression for fast mobile loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript audio/mpeg;
    gzip_min_length 1000;

    # Single Page Application (SPA) routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API endpoints directly to FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Static dataset audio assets (Badaga & Marwari WAV clips)
    location /audio/ {
        alias /var/www/kurinji/frontend/dist/audio/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

